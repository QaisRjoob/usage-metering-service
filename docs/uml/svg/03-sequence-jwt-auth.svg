;"/><text x="534.002" y="514.511" fill="#000" font-size="14" textLength="200.231" font-family="Arial">use old token, save new one</text><polygon points="284.886,546.109,274.886,550.109,284.886,554.109,280.886,550.109" fill="#4F46E5" style="stroke:#4F46E5;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278.886" y1="550.109" x2="521.002" y2="550.109" style="stroke:#4F46E5;stroke-width:1.3;stroke-dasharray:2,2;"/><text x="285.886" y="544.808" fill="#000" font-size="14" textLength="224.116" font-family="Arial">new access token + new cookie</text><rect x="10" y="579.258" width="810.461" height="3" fill="#E0E7FF" style="stroke:#E0E7FF;stroke-width:1;" rx="6" ry="6"/><line x1="10" y1="579.258" x2="820.461" y2="579.258" style="stroke:#4F46E5;stroke-width:1;"/><line x1="10" y1="582.258" x2="820.461" y2="582.258" style="stroke:#4F46E5;stroke-width:1;"/><rect x="372.783" y="568.109" width="84.896" height="24.297" fill="#E0E7FF" style="stroke:#4F46E5;stroke-width:2;" rx="6" ry="6"/><text x="378.783" y="585.104" fill="#000" font-size="14" textLength="66.021" font-weight="700" font-family="Arial">Sign out</text><polygon points="261.886,620.703,271.886,624.703,261.886,628.703,265.886,624.703" fill="#4F46E5" style="stroke:#4F46E5;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="28.955" y1="624.703" x2="267.886" y2="624.703" style="stroke:#4F46E5;stroke-width:1.3;"/><text x="122.463" y="619.401" fill="#000" font-size="14" textLength="57.914" font-family="Arial">Sign out</text><polygon points="510.002,651,520.002,655,510.002,659,514.002,655" fill="#4F46E5" style="stroke:#4F46E5;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="273.886" y1="655" x2="516.002" y2="655" style="stroke:#4F46E5;stroke-width:1.3;"/><text x="334.51" y="649.698" fill="#000" font-size="14" textLength="126.868" font-family="Arial">POST /auth/logout</text><polygon points="734.233,681.297,744.233,685.297,734.233,689.297,738.233,685.297" fill="#4F46E