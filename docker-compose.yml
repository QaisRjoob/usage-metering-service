# Full stack: PostgreSQL + API (migrations and seed at startup) + web dashboard/Client Demo.
#   docker compose up --build
# Web:  http://localhost:8080 (the web server also forwards /api/* to the API, so the app never
#       makes cross-origin calls)      API: http://localhost:3000/api/v1      Docs: http://localhost:3000/docs
# Runs without an OpenAI key (AI_PROVIDER defaults to mock).
# Ports are published on the loopback addresses only (IPv4 127.0.0.1 and IPv6 ::1, so "localhost"
# works whichever one the browser picks): the stack is reachable from this computer, not the network.
# restart: unless-stopped brings the stack back after Docker Desktop or the computer restarts.
name: usage-metering

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [metering]
    ports:
      # Published on 5433 for local inspection (psql) without clashing with a native PostgreSQL.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    healthcheck:
      # Over TCP: on a fresh volume the image first runs a socket-only setup server, which a plain
      # pg_isready would already report as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://metering:metering@postgres:5432/metering
      DATABASE_POOL_MAX: "20"
      # Local/demo operator token (exchanged at POST /auth/token for an operator JWT). Override in a
      # .env file next to this compose file.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-admin-token-change-me}
      # Signs the JWT access tokens (HS256). Local/demo value: override it for anything real.
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-change-me-0123456789abcdef}
      # http:// locally; set true behind HTTPS so the refresh cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Only for direct browser calls (e.g. a dev server pointed at :3000); the web app is same-origin.
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: "true"
      DEMO_API_KEY: umk_demo_local_only_do_not_use_in_production
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Trust X-Forwarded-For from the web container only (it overwrites the header), so rate limits
      # see the real client; direct callers of port 3000 cannot fake their address.
      TRUST_PROXY_ADDRESSES: 172.30.0.10
    networks: [metering]
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEMO_API_KEY: umk_demo_local_only_do_not_use_in_production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      metering:
        # Fixed so the API can trust exactly this proxy (TRUST_PROXY_ADDRESSES).
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"

networks:
  metering:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
