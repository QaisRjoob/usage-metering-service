# Full stack: PostgreSQL + API (migrations and seed at startup) + web dashboard/Client Demo.
#   docker compose up --build
# Web:  http://localhost:8080      API: http://localhost:3000/api/v1      Docs: http://localhost:3000/docs
# Runs without an OpenAI key (AI_PROVIDER defaults to mock).
# Ports are published on the loopback addresses only (IPv4 127.0.0.1 and IPv6 ::1, so "localhost"
# works whichever one the browser picks): the stack is reachable from this computer, not the network.
name: usage-metering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on 5433 for local inspection (psql) without clashing with a native PostgreSQL.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://metering:metering@postgres:5432/metering
      DATABASE_POOL_MAX: "20"
      # Local/demo operator token. Override in a .env file next to this compose file.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-admin-token-change-me}
      # The web app may be opened as localhost or 127.0.0.1; both are allowed.
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: "true"
      DEMO_API_KEY: umk_demo_local_only_do_not_use_in_production
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # The API is reached directly (no reverse proxy), so X-Forwarded-For is not trusted.
      TRUST_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
        VITE_DEMO_API_KEY: umk_demo_local_only_do_not_use_in_production
        # Allowed in the page's Content-Security-Policy (connect-src).
        API_ORIGIN: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"

volumes:
  pgdata:
